<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>AI for Beginners</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
</head>

<body>
  <div id="app"></div>
  <script>
    // Keep section links from the former history router (/?id=...) working with the hash router.
    const legacyId = new URLSearchParams(location.search).get('id');
    if (legacyId && !location.hash) {
      history.replaceState(null, '', location.pathname + '#/?id=' + encodeURIComponent(legacyId));
    }

    window.$docsify = {
      name: 'AI for Beginners',
      repo: 'https://github.com/Microsoft/AI-For-Beginners',
      relativePath: true,
      auto2top: true,
      plugins: [
        // Raw HTML in the lessons uses paths relative to its markdown file, but the hash router
        // serves every page from the site root, so resolve them the way Docsify resolves markdown.
        function (hook, vm) {
          const isRelative = url => !/^([a-z][a-z\d+.-]*:|\/|#)/i.test(url);

          hook.afterEach(function (html) {
            const page = document.createElement('template');
            page.innerHTML = html;
            const file = new URL(vm.route.file, location.href);

            page.content.querySelectorAll('[src]').forEach(el => {
              const src = el.getAttribute('src');
              if (isRelative(src)) el.setAttribute('src', new URL(src, file).href);
            });
            page.content.querySelectorAll('a[href]').forEach(el => {
              const href = el.getAttribute('href');
              if (isRelative(href)) el.setAttribute('href', vm.router.toURL(href, null, vm.router.getCurrentPath()));
            });

            return page.innerHTML;
          });
        }
      ]
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/docsify.min.js"></script>
</body>

</html>
